services:
  db:
    image: postgres:16-alpine
    container_name: artha_pilot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: artha
      POSTGRES_PASSWORD: artha_dev_password
      POSTGRES_DB: artha_pilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artha -d artha_pilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: artha_pilot_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://artha:artha_dev_password@db:5432/artha_pilot
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      # Grounded AI assistant: pass LLM_* through from the host environment.
      # Leave unset (or empty) to keep the assistant disabled - the API then
      # returns "llm_not_configured" instead of pretending to work.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RESPONSE_CHARS: ${LLM_MAX_RESPONSE_CHARS:-2400}
    ports:
      - "8000:8000"

volumes:
  pgdata:
